name: Continuous Integration

on:
  pull_request:
    branches: [ main, develop ]
  push:
    branches: [ develop ]

env:
  NODE_VERSION: '22'
  PHP_VERSION: '8.2'
  PYTHON_VERSION: '3.11'

jobs:
  lint-frontend:
    name: Frontend Linting & Type Check
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: ${{ env.NODE_VERSION }}
          cache: 'npm'
          cache-dependency-path: frontend/package-lock.json

      - name: Install dependencies
        working-directory: frontend
        run: npm ci || npm install

      - name: Run ESLint
        working-directory: frontend
        run: npm run lint

      - name: TypeScript Type Check
        working-directory: frontend
        run: npx tsc --noEmit

      - name: Check Code Formatting
        working-directory: frontend
        run: npm run format:check || echo "Format check not configured"

  test-frontend:
    name: Frontend Tests
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: ${{ env.NODE_VERSION }}
          cache: 'npm'
          cache-dependency-path: frontend/package-lock.json

      - name: Install dependencies
        working-directory: frontend
        run: npm ci || npm install

      - name: Run Tests
        working-directory: frontend
        run: npm test -- --coverage || echo "Tests not configured"

      - name: Upload Coverage
        uses: codecov/codecov-action@v4
        if: success()
        with:
          files: ./frontend/coverage/coverage-final.json
          flags: frontend
          name: frontend-coverage

  lint-backend:
    name: Backend Linting & Code Quality
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7

      - name: Setup PHP
        uses: shivammathur/setup-php@v2
        with:
          php-version: ${{ env.PHP_VERSION }}
          extensions: mbstring, xml, ctype, iconv, intl, pdo_mysql
          tools: phpstan, php-cs-fixer

      - name: Cache Composer dependencies
        uses: actions/cache@v4
        with:
          path: ~/.composer/cache/files
          key: ${{ runner.os }}-composer-${{ hashFiles('backend/composer.lock') }}

      - name: Install dependencies
        working-directory: backend
        run: composer install --prefer-dist --no-progress

      - name: Run PHP CS Fixer (dry-run)
        working-directory: backend
        run: |
          composer require --dev friendsofphp/php-cs-fixer || true
          vendor/bin/php-cs-fixer fix --dry-run --diff || echo "PHP CS Fixer not configured"

      - name: Run PHPStan
        working-directory: backend
        run: |
          composer require --dev phpstan/phpstan || true
          vendor/bin/phpstan analyse app --level=5 || echo "PHPStan not configured"

  test-backend:
    name: Backend Tests
    runs-on: ubuntu-latest
    services:
      mysql:
        image: mysql:8.0
        env:
          MYSQL_ROOT_PASSWORD: root
          MYSQL_DATABASE: shopintelli_test
        ports:
          - 3306:3306
        options: >-
          --health-cmd="mysqladmin ping -h 127.0.0.1 -proot"
          --health-interval=10s
          --health-timeout=5s
          --health-retries=3

      redis:
        image: redis:alpine
        ports:
          - 6379:6379
        options: >-
          --health-cmd="redis-cli ping"
          --health-interval=10s
          --health-timeout=5s
          --health-retries=3

    steps:
      - uses: actions/checkout@v7

      - name: Setup PHP
        uses: shivammathur/setup-php@v2
        with:
          php-version: ${{ env.PHP_VERSION }}
          extensions: mbstring, xml, ctype, iconv, intl, pdo_mysql
          coverage: xdebug

      - name: Cache Composer dependencies
        uses: actions/cache@v4
        with:
          path: ~/.composer/cache/files
          key: ${{ runner.os }}-composer-${{ hashFiles('backend/composer.lock') }}

      - name: Install dependencies
        working-directory: backend
        run: composer install --prefer-dist --no-progress

      - name: Copy .env
        working-directory: backend
        run: php -r "file_exists('.env') || copy('.env.example', '.env');"

      - name: Generate key
        working-directory: backend
        run: php artisan key:generate

      - name: Directory Permissions
        working-directory: backend
        run: chmod -R 777 storage bootstrap/cache

      - name: Run Migrations
        working-directory: backend
        env:
          DB_HOST: 127.0.0.1
          DB_DATABASE: shopintelli_test
          DB_USERNAME: root
          DB_PASSWORD: root
        run: php artisan migrate --force

      - name: Execute tests (Unit and Feature tests)
        working-directory: backend
        env:
          DB_HOST: 127.0.0.1
          DB_DATABASE: shopintelli_test
          DB_USERNAME: root
          DB_PASSWORD: root
          REDIS_HOST: 127.0.0.1
        run: php artisan test --coverage --parallel

      - name: Upload Coverage
        uses: codecov/codecov-action@v4
        if: success()
        with:
          files: ./backend/coverage.xml
          flags: backend
          name: backend-coverage

  test-ai-service:
    name: AI Service Tests
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7

      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: ${{ env.PYTHON_VERSION }}
          cache: 'pip'

      - name: Install dependencies
        working-directory: ai-service
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt
          pip install pytest pytest-cov flake8 black mypy

      - name: Lint with flake8
        working-directory: ai-service
        run: |
          flake8 app --count --select=E9,F63,F7,F82 --show-source --statistics
          flake8 app --count --exit-zero --max-complexity=10 --max-line-length=127 --statistics

      - name: Check code formatting with black
        working-directory: ai-service
        run: black --check app || echo "Black not configured"

      - name: Type check with mypy
        working-directory: ai-service
        run: mypy app --ignore-missing-imports || echo "MyPy not configured"

      - name: Run tests with pytest
        working-directory: ai-service
        run: pytest --cov=app --cov-report=xml --cov-report=term-missing

      - name: Upload Coverage
        uses: codecov/codecov-action@v4
        if: success()
        with:
          files: ./ai-service/coverage.xml
          flags: ai-service
          name: ai-service-coverage

  security-scan:
    name: Security Vulnerability Scan
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7

      - name: Run Trivy vulnerability scanner
        uses: aquasecurity/trivy-action@master
        with:
          scan-type: 'fs'
          scan-ref: '.'
          format: 'sarif'
          output: 'trivy-results.sarif'

      - name: Upload Trivy results to GitHub Security tab
        uses: github/codeql-action/upload-sarif@v3
        if: always()
        with:
          sarif_file: 'trivy-results.sarif'

      - name: PHP Security Check
        working-directory: backend
        run: |
          composer require --dev enlightn/security-checker || true
          vendor/bin/security-checker security:check composer.lock || echo "Security checker not available"

      - name: NPM Audit
        working-directory: frontend
        run: npm audit --audit-level=moderate || echo "Vulnerabilities found"

      - name: Python Safety Check
        working-directory: ai-service
        run: |
          pip install safety
          safety check || echo "Vulnerabilities found"

  docker-build:
    name: Docker Build Test
    runs-on: ubuntu-latest
    strategy:
      matrix:
        service: [frontend, backend, ai-service]
    steps:
      - uses: actions/checkout@v7

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Build Docker image
        uses: docker/build-push-action@v5
        with:
          context: ./${{ matrix.service }}
          file: ./${{ matrix.service }}/Dockerfile
          push: false
          tags: shopintelli-${{ matrix.service }}:test
          cache-from: type=gha
          cache-to: type=gha,mode=max

  code-quality:
    name: Code Quality Analysis
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
        with:
          fetch-depth: 0

      - name: SonarCloud Scan
        uses: SonarSource/sonarcloud-github-action@master
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          SONAR_TOKEN: ${{ secrets.SONAR_TOKEN }}
        continue-on-error: true

  dependency-review:
    name: Dependency Review
    runs-on: ubuntu-latest
    if: github.event_name == 'pull_request'
    steps:
      - uses: actions/checkout@v7

      - name: Dependency Review
        uses: actions/dependency-review-action@v4
        with:
          fail-on-severity: moderate
